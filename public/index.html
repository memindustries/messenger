<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Buddy Messenger</title>
  <link rel="icon" href="/img/buddy.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/aim.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <main id="desktop" aria-live="polite"></main>
  <footer id="taskbar">
    <div class="start"><img src="/img/buddy.svg" alt="" width="18" height="18"><span id="app-name">Buddy Messenger</span></div>
    <div class="tasks" id="tasks"></div>
    <div class="clock" id="clock"></div>
  </footer>
  <noscript><div class="noscript">This messenger encrypts everything in your browser, so it needs JavaScript.</div></noscript>
</body>
</html>
